<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #0D0C0B; }
    a { color: #db0000; } a:hover { color: #a30000; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #0D0C0B; display: flex; flex-direction: column; justify-content: space-between">

  <div style="display: flex; align-items: center; gap: 28px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">04</span>
    <div style="flex-grow: 1; height: 2px; background: rgba(251, 250, 248, 0.16)"></div>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em; color: rgba(251, 250, 248, 0.52)">@soolifestyle</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 36px">
    <p style="margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.35; letter-spacing: -0.01em; color: rgba(251, 250, 248, 0.55)">Parce que la vraie réponse, c'était :</p>
    <p style="margin: 0; font-family: Lora, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 140px; line-height: 1; letter-spacing: -0.035em; color: #FBFAF8">Oui<span style="color: {{accent}}">.</span></p>
    <p style="margin: 0; font-family: Lora, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 72px; line-height: 1.12; letter-spacing: -0.02em; color: #FBFAF8; text-wrap: balance">Mais c'est pas <span style="color: {{accent}}">la partie qui compte.</span></p>
  </div>

  <div style="display: flex; justify-content: flex-end; align-items: flex-end">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">Swipe →</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#db0000","options":["#db0000","#E63946","#0D0C0B","#FBFAF8"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#db0000' };
  }
}
</script>
</body>
</html>
