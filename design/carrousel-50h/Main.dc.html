<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #0D0C0B; }
    a { color: #db0000; } a:hover { color: #a30000; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #0D0C0B; display: flex; flex-direction: column; justify-content: space-between">

  <div style="display: flex; align-items: center; gap: 28px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">01</span>
    <div style="flex-grow: 1; height: 2px; background: rgba(251, 250, 248, 0.16)"></div>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em; color: rgba(251, 250, 248, 0.52)">@soolifestyle</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 44px">
    <div style="display: flex; flex-direction: column">
      <span style="font-family: Lora, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 240px; line-height: 0.9; letter-spacing: -0.03em; color: {{accent}}">50h</span>
      <span style="font-family: Lora, Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 100px; line-height: 1.05; letter-spacing: -0.02em; color: #FBFAF8">par semaine.</span>
    </div>
    <div style="width: 160px; height: 6px; background: {{accent}}"></div>
    <p style="margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 42px; line-height: 1.38; letter-spacing: -0.01em; color: rgba(251, 250, 248, 0.74); max-width: 820px; text-wrap: pretty">Dans un métier qu'il déteste.<br>Pour financer une vie qu'il a pas le temps de vivre.</p>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(251, 250, 248, 0.42)">Une histoire vraie</span>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">Swipe →</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#db0000","options":["#db0000","#E63946","#0D0C0B","#FBFAF8"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#db0000' };
  }
}
</script>
</body>
</html>
