<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Instrument+Sans:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #FBFAF8; }
    a { color: #db0000; } a:hover { color: #a30000; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #FBFAF8; display: flex; flex-direction: column; justify-content: space-between">

  <div style="display: flex; align-items: center; gap: 28px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">02</span>
    <div style="flex-grow: 1; height: 2px; background: rgba(13, 12, 11, 0.14)"></div>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.14em; color: rgba(13, 12, 11, 0.46)">@soolifestyle</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 40px">
    <p style="margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.35; letter-spacing: -0.01em; color: rgba(13, 12, 11, 0.55)">L'autre jour, il m'a demandé :</p>
    <div style="display: flex; gap: 20px; align-items: flex-start">
      <span style="font-family: Lora, Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 160px; line-height: 0.82; color: {{accent}}">«</span>
      <p style="margin: 0; font-family: Lora, Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 600; font-size: 84px; line-height: 1.16; letter-spacing: -0.015em; color: #0D0C0B; text-wrap: pretty">Sérieux, ça marche ton truc de vendre depuis ton téléphone ?<span style="color: {{accent}}"> »</span></p>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(13, 12, 11, 0.38)">Un pote. 50h/semaine.</span>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">Swipe →</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#db0000","options":["#db0000","#E63946","#0D0C0B","#FBFAF8"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#db0000' };
  }
}
</script>
</body>
</html>
