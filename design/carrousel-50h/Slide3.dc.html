<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@500;600&family=Instrument+Serif:ital@1&display=swap">
  <style>
    body { margin: 0; background: #FBFAF8; }
    a { color: #db0000; } a:hover { color: #a30000; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px; background: #FBFAF8; display: flex; flex-direction: column; justify-content: space-between">

  <div style="display: flex; align-items: center; gap: 28px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">03</span>
    <div style="flex-grow: 1; height: 2px; background: rgba(13, 12, 11, 0.14)"></div>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(13, 12, 11, 0.38)">Soolifestyle</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 48px">
    <p style="margin: 0; font-family: 'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 112px; line-height: 0.96; letter-spacing: -0.04em; color: #0D0C0B; text-wrap: balance">J'ai pas su quoi répondre<span style="color: {{accent}}">.</span></p>
    <div style="width: 160px; height: 6px; background: {{accent}}"></div>
    <p style="margin: 0; font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 42px; line-height: 1.38; letter-spacing: -0.01em; color: rgba(13, 12, 11, 0.62); max-width: 780px; text-wrap: pretty">La réponse était pas compliquée.<br>Elle était juste ailleurs.</p>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(13, 12, 11, 0.38)">[@TON HANDLE]</span>
    <span style="font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: {{accent}}">Swipe →</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#db0000","options":["#db0000","#E63946","#0D0C0B","#FBFAF8"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#db0000' };
  }
}
</script>
</body>
</html>
