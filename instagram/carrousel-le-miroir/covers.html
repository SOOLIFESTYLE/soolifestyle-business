<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le miroir — couverture v3, cadre rentré ou sans cadre</title>
<style>
  @font-face { font-family:'Display'; src:url('fonts/playfairdisplay-500.ttf')  format('truetype'); font-weight:500; font-style:normal; }
  @font-face { font-family:'Display'; src:url('fonts/playfairdisplay-600.ttf')  format('truetype'); font-weight:600; font-style:normal; }
  @font-face { font-family:'Display'; src:url('fonts/playfairdisplay-500i.ttf') format('truetype'); font-weight:500; font-style:italic; }
  @font-face { font-family:'Display'; src:url('fonts/playfairdisplay-600i.ttf') format('truetype'); font-weight:600; font-style:italic; }
  @font-face { font-family:'Sans'; src:url('fonts/jost-300.ttf') format('truetype'); font-weight:300; }
  @font-face { font-family:'Sans'; src:url('fonts/jost-400.ttf') format('truetype'); font-weight:400; }
  @font-face { font-family:'Sans'; src:url('fonts/jost-500.ttf') format('truetype'); font-weight:500; }

  :root{
    --red:#db0000;
    --ink:#0c0c0c;
    --paper:#f7f5f0;
    --pad:72px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#3a3a3a; display:flex; flex-direction:column; align-items:center; gap:44px; padding:44px; }

  .cv{
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* cadre rentré : tient entièrement dans le carré central (y 135 → 1215) */
  .frame{ position:absolute; z-index:0; inset:152px 58px 150px; border:3px solid var(--red); }

  /* ---- habillage ---- */
  .m{
    position:absolute; z-index:3; font-family:'Sans', sans-serif;
    font-size:19px; font-weight:400; letter-spacing:.3em; text-transform:uppercase;
  }
  .m-brand{ top:62px; left:var(--pad); font-weight:500; }
  .m-tag  { top:62px; right:var(--pad); font-weight:300; color:rgba(12,12,12,.45); letter-spacing:.24em; }
  .m-next { bottom:62px; right:var(--pad); color:var(--red); font-weight:500;
            font-size:24px; letter-spacing:.1em; }
  .m sup{ font-size:.55em; letter-spacing:0; vertical-align:.7em; }

  .bar{ position:absolute; z-index:3; left:0; bottom:0; height:6px; width:100%;
        background:rgba(12,12,12,.09); }
  .bar i{ display:block; height:100%; width:154px; background:var(--red); }

  /* ---- bloc titre, centré ---- */
  .wrap{
    position:absolute; z-index:1; left:0; right:0;
    top:50%; transform:translateY(-50%);
    padding:0 var(--pad); text-align:center;
  }

  .title{
    font-family:'Display', Georgia, serif; font-weight:600;
    text-transform:uppercase; font-size:100px; line-height:1.26; letter-spacing:-.008em;
  }
  .chip{ display:inline-block; padding:4px 26px 14px; background:var(--red); color:#fff; }

  .hr{ width:84px; height:3px; background:var(--red); margin:44px auto; }

  .end5a{
    font-family:'Display', Georgia, serif; font-weight:500; font-style:italic;
    font-size:54px; line-height:1.1;
  }
  .end5b{
    font-family:'Display', Georgia, serif; font-weight:600;
    text-transform:uppercase; font-size:116px; line-height:1.02;
    letter-spacing:-.01em; color:var(--red); margin-top:10px;
  }
</style>
</head>
<body>

<!-- ══════ A — cadre rentré dans le carré central ══════ -->
<div class="cv" id="va">
  <div class="frame"></div>
  <div class="m m-brand">Soolifestyle<sup>&#8482;</sup></div>
  <div class="m m-tag">Psychologie &middot; Influence</div>

  <div class="wrap">
    <div class="title">
      Tu as arrêté<br><span class="chip">ton scroll</span><br>sur ce post.
    </div>
    <div class="hr"></div>
    <div class="end5a">Voilà exactement</div>
    <div class="end5b">Pourquoi.</div>
  </div>

  <div class="m m-next">&rsaquo;&rsaquo;&rsaquo;</div>
  <div class="bar"><i></i></div>
</div>

<!-- ══════ B — sans cadre ══════ -->
<div class="cv" id="vb">
  <div class="m m-brand">Soolifestyle<sup>&#8482;</sup></div>
  <div class="m m-tag">Psychologie &middot; Influence</div>

  <div class="wrap">
    <div class="title">
      Tu as arrêté<br><span class="chip">ton scroll</span><br>sur ce post.
    </div>
    <div class="hr"></div>
    <div class="end5a">Voilà exactement</div>
    <div class="end5b">Pourquoi.</div>
  </div>

  <div class="m m-next">&rsaquo;&rsaquo;&rsaquo;</div>
  <div class="bar"><i></i></div>
</div>

</body>
</html>
